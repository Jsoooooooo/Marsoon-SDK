name: Publish Marsoon Chart SDK to npm
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  id-token: write
concurrency:
  group: marsoon-sdk-npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - name: Check published version
        id: registry
        shell: bash
        run: |
          set -Eeuo pipefail
          spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          if npm view "$spec" version >/dev/null 2>&1; then
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Stage runtime package
        if: steps.registry.outputs.publish == 'true'
        id: pack
        shell: bash
        run: |
          set -Eeuo pipefail
          publish_dir="$RUNNER_TEMP/marsoon-sdk-publish"
          mkdir -p "$publish_dir/runtime"
          cp package.json "$publish_dir/package.json"
          cp runtime/* "$publish_dir/runtime/"
          tarball="$(npm pack "$publish_dir" --silent --ignore-scripts --pack-destination "$RUNNER_TEMP")"
          echo "tarball=$RUNNER_TEMP/$tarball" >> "$GITHUB_OUTPUT"
      - name: Publish runtime package
        if: steps.registry.outputs.publish == 'true'
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
      - name: Verify registry version
        if: steps.registry.outputs.publish == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          spec="$(node -p "const p=require('./package.json'); p.name+'@'+p.version")"
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            if npm view "$spec" version --prefer-online --fetch-retries=0 --fetch-timeout=10000 >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          exit 1
