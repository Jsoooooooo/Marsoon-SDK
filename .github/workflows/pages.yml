name: Deploy Marsoon SDK Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: marsoon-sdk-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - name: Stage runtime assets
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p _site/runtime
          core_js="$(node -p "require('./runtime/sdk-manifest.json').core.js")"
          runtime_js="$(node -p "require('./runtime/sdk-manifest.json').runtime.js")"
          runtime_wasm="$(node -p "require('./runtime/sdk-manifest.json').runtime.wasm")"
          cp runtime/sdk-manifest.json "runtime/$core_js" "runtime/$runtime_js" "runtime/$runtime_wasm" _site/runtime/
          test ! -e _site/runtime/marsoon-chart.js
          test ! -e _site/runtime/marsoon-chart-loader.js
          test ! -e _site/runtime/runtime-manifest.json
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
