name: Deploy Marsoon SDK Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: marsoon-sdk-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out compiled SDK repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Stage the Pages-only tree
        run: |
          mkdir -p _site/runtime
          core_js="$(node -e "const m=require('./runtime/sdk-manifest.json'); process.stdout.write(m.core.js)")"
          runtime_js="$(node -e "const m=require('./runtime/sdk-manifest.json'); process.stdout.write(m.runtime.js)")"
          runtime_wasm="$(node -e "const m=require('./runtime/sdk-manifest.json'); process.stdout.write(m.runtime.wasm)")"
          cp runtime/sdk-manifest.json \
            "runtime/$core_js" "runtime/$runtime_js" "runtime/$runtime_wasm" _site/runtime/
          snippet_list="$RUNNER_TEMP/marsoon-sdk-runtime-snippets.txt"
          node - "$runtime_js" <<'NODE' > "$snippet_list"
          const fs = require('node:fs');
          const source = fs.readFileSync(`runtime/${process.argv[2]}`, 'utf8');
          const snippets = new Set();
          for (const match of source.matchAll(/["']\.\/(snippets\/rt-[0-9a-f]+\/inline\d+\.js)["']/g)) {
            snippets.add(match[1]);
          }
          for (const snippet of [...snippets].sort()) console.log(snippet);
          NODE
          while IFS= read -r snippet; do
            test -n "$snippet" || continue
            test -f "runtime/$snippet"
            mkdir -p "_site/runtime/$(dirname "$snippet")"
            cp "runtime/$snippet" "_site/runtime/$snippet"
          done < "$snippet_list"
          test ! -e _site/runtime/marsoon-chart.js
          test ! -e _site/runtime/marsoon-chart-loader.js
          test ! -e _site/runtime/runtime-manifest.json
          touch _site/.nojekyll

      - name: Upload compiled SDK site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
